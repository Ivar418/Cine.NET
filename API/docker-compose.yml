# docker compose file for local dev

services:
  api:
    build:
      context: ..
      dockerfile: API/Dockerfile
    ports:
      - "8080:8080"
      - "7172:7172"
    env_file:
      - .env
    volumes:
      - ./https:/https:ro
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080;https://+:7172"
      ASPNETCORE_Kestrel__Certificates__Default__Path: "/https/aspnetapp.pfx"
      ASPNETCORE_Kestrel__Certificates__Default__Password: "${KESTREL_CERT_PASSWORD}"
      ConnectionStrings__DefaultConnection: >
        Server=${DB_HOST};
        Port=${DB_PORT};
        Database=${DB_NAME};
        User=${DB_USER};
        Password=${DB_PASSWORD};
      TMDB_API_KEY_READ_ONLY: ${TMDB_API_KEY_READ_ONLY}
      JwtSettings__Key: ${JWT_KEY}
      JwtSettings__Issuer: ${JWT_ISSUER}
      JwtSettings__Audience: ${JWT_AUDIENCE}
      JwtSettings__ExpiryMinutes: ${JWT_EXPIRY_MINUTES}
    depends_on:
      - db
    labels:
      - env=local
      - service=webapi

  db:
    build:
      context: ..
      dockerfile: API/db/Dockerfile
    image: cine-db:local
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8081:80"
    env_file:
      - .env
    environment:
      PMA_HOST: ${DB_HOST}
      PMA_USER: ${DB_ROOT_USER}
      PMA_PASSWORD: ${DB_ROOT_PASSWORD}
    depends_on:
      - db

volumes:
  mysql_data:
